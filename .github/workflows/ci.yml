# CI — ogni push/PR esegue le suite di test del backend (regole di sicurezza
# fail-closed incluse) e verifica che il frontend compili contro il backend mock.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Test suite (mock mode, offline)
        env:
          USE_MOCK_DATA: "true"
        run: |
          set -e
          for t in tests/test_*.py; do
            echo "── $t ──"
            python3 "$t"
          done

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Avvia backend mock (per il prerender delle pagine server)
        working-directory: backend
        env:
          USE_MOCK_DATA: "true"
        run: |
          pip install -r requirements.txt
          nohup python3 -m uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && break || sleep 1
          done
      - name: Build Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
        run: |
          npm ci
          npm run build
